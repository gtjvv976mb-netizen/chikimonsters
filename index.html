<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chiki Monsters — Welcome to Chikoria</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800;900&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--gold:#ffd34d;--ink:#2a1a08;}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:#061426;font-family:'Nunito',system-ui,sans-serif;color:#fff}
  a{color:inherit;text-decoration:none}
  #hero{position:fixed;inset:0;background:url("homepage-hero.png?v=meme7") center center/cover no-repeat;transition:opacity .6s}

  /* (the info tabs moved to the game's loading page — realm/) */

  /* ---- $CHIKI token = PLAY button (real token image laid exactly over the swirl emblem) ---- */
  #tokenBtn{position:fixed;cursor:pointer;z-index:20;transform:translate(-50%,-50%);object-fit:contain;
    -webkit-user-drag:none;user-select:none;animation:tokglow 2.1s ease-in-out infinite;transition:opacity .45s ease,transform .12s ease}
  #tokenBtn:hover{animation:none;transform:translate(-50%,-50%) scale(1.06);
    filter:drop-shadow(0 5px 12px rgba(0,0,0,.55)) drop-shadow(0 0 26px rgba(150,215,255,.95))}
  #tokenBtn:active{transform:translate(-50%,-50%) scale(.95)}
  @keyframes tokglow{0%,100%{filter:drop-shadow(0 5px 12px rgba(0,0,0,.5)) drop-shadow(0 0 8px rgba(120,200,255,.4))}
    50%{filter:drop-shadow(0 5px 12px rgba(0,0,0,.5)) drop-shadow(0 0 24px rgba(120,200,255,.85))}}
  #tokenHint{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:21;pointer-events:none;text-align:center;
    font-family:'Baloo 2','Nunito',sans-serif;font-weight:800;color:#eaf6ff;font-size:clamp(14px,2.2vw,20px);
    text-shadow:0 2px 8px rgba(0,0,0,.75),0 0 16px rgba(80,160,255,.5);animation:hintbob 1.6s ease-in-out infinite;white-space:nowrap;transition:opacity .45s ease}
  #tokenHint .tk{color:#ffe978}
  @keyframes hintbob{50%{transform:translateX(-50%) translateY(-5px)}}

  .fading{opacity:0 !important;pointer-events:none}
  body.intro #hero,body.intro #tokenBtn,body.intro #tokenHint{opacity:0;pointer-events:none}
  #introVid{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;background:#000;opacity:0;pointer-events:none;transition:opacity .7s ease;z-index:50}
  body.intro #introVid{opacity:1;pointer-events:auto}
  #skipHint{position:fixed;right:22px;bottom:18px;z-index:51;display:none;font-family:'Baloo 2';font-weight:800;font-size:13px;
    color:rgba(255,255,255,.85);background:rgba(0,0,0,.45);padding:7px 16px;border-radius:999px;border:1px solid rgba(255,255,255,.3);cursor:pointer}
  body.intro #skipHint{display:block}
  #gameFrame{position:fixed;inset:0;width:100%;height:100%;border:0;display:none;background:#061426}
  body.playing #hero,body.playing #tokenBtn,body.playing #tokenHint,body.playing #introVid,body.playing #skipHint{display:none}
  body.playing #gameFrame{display:block}
  ::-webkit-scrollbar{width:9px}::-webkit-scrollbar-thumb{background:#29476f;border-radius:5px}
</style>
</head>
<body>
<div id="hero"></div>
<img id="tokenBtn" src="ui/chiki-token-btn.png?v=1" alt="Play" title="Press the $CHIKI token to play" draggable="false">

<div id="tokenHint">👆 Press the <span class="tk">$CHIKI</span> token to play</div>

<video id="introVid" src="intro.mp4?v=meme5" playsinline preload="auto"></video>
<div id="skipHint">Skip ▶</div>
<iframe id="gameFrame" title="Chiki Monsters" allow="clipboard-write"></iframe>

<script>
(function(){
  var btn=document.getElementById("tokenBtn"),hint=document.getElementById("tokenHint"),
      vid=document.getElementById("introVid"),
      frame=document.getElementById("gameFrame"),skip=document.getElementById("skipHint"),
      done=false;

  function toGame(){if(done)return;done=true;try{vid.pause();}catch(e){}
    /* the token was already pressed HERE — tell the realm so it skips its own title
       screen (same art + same token = a confusing double homepage) and goes straight
       to the loading page. Direct /realm visitors still get the title. */
    try{sessionStorage.setItem("realm-hero-done","1");}catch(e){}
    location.href="realm/";}   /* the intro now leads straight into the 3D MMO */
  var started=false;
  function start(){
    if(started)return; started=true;
    /* start the movie WITHIN the click gesture so audio is allowed; fall back to muted autoplay */
    try{ vid.currentTime=0; }catch(e){}
    var p=vid.play(); if(p&&p.catch)p.catch(function(){ vid.muted=true; var q=vid.play(); if(q&&q.catch)q.catch(toGame); });
    /* next frame → add .intro so CSS cross-fades the homepage out and the movie in together */
    requestAnimationFrame(function(){ document.body.classList.add("intro"); });
    vid.onended=toGame; vid.onerror=toGame; skip.onclick=toGame; vid.onclick=toGame;
  }
  if(btn)btn.onclick=start;

  /* position the round $CHIKI-token hotspot over the swirl emblem (covers as the bg scales) */
  var SW_X=0.503, SW_Y=0.420;   /* $CHIKI token (swirl) center, normalized to the 1600×900 hero image */
  var probe=new Image();
  function place(){
    if(!btn||!probe.naturalWidth)return;
    var vw=innerWidth,vh=innerHeight,iw=probe.naturalWidth,ih=probe.naturalHeight;
    var s=Math.max(vw/iw,vh/ih),dw=iw*s,dh=ih*s,xOff=(vw-dw)/2,yOff=(vh-dh)/2;
    var cx=xOff+SW_X*dw, cy=yOff+SW_Y*dh;
    var d=Math.max(52,0.102*dw);           /* token button: small coin sitting in the wreath (swirl painted out of bg) */
    btn.style.left=cx+"px"; btn.style.top=cy+"px"; btn.style.width=d+"px"; btn.style.height=d+"px";
    /* hint is pinned to the bottom-center of the screen via CSS (no per-token positioning) */
  }
  probe.onload=place; probe.src="homepage-hero.png?v=meme7"; addEventListener("resize",place); setTimeout(place,60);
})();
</script>
</body>
</html>
