; The iOS export preset. __TEAM_ID__, __TEMPLATE__, __VERSION__ and __BUILD__ are filled in by CI.
[preset.0]

name="iOS"
platform="iOS"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="build/Probe.ipa"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.0.options]

custom_template/debug=""
custom_template/release="__TEMPLATE__"
architectures/arm64=true
application/app_store_team_id="__TEAM_ID__"
application/export_method_release=0
application/bundle_identifier="com.chikimonsters.tlsprobe"
application/signature=""
application/short_version="__VERSION__"
application/version="__BUILD__"
application/min_ios_version="16.0"
application/targeted_device_family=0
application/export_project_only=true
application/additional_plist_content="<key>ITSAppUsesNonExemptEncryption</key><false/>"
capabilities/access_wifi=false
capabilities/performance_gaming_tier=false
capabilities/performance_a12=false
user_data/accessible_from_files_app=false
user_data/accessible_from_itunes_sharing=false
privacy/tracking_enabled=false
icons/icon_1024x1024="res://icon1024.png"
storyboard/image_scale_mode=0
storyboard/use_custom_bg_color=true
storyboard/custom_bg_color=Color(0.043, 0.071, 0.125, 1)
